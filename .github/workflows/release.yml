# Nobody types a version here. Conventional-commit subjects landing on `main`
# accumulate into a release PR that bumps the four manifests in lockstep and
# writes `CHANGELOG.md`; merging that PR tags, creates the GitHub release, and
# releases the publish job below. The version is a reading of what merged, so
# the only way to get a major is to have written `!` on a commit.
name: Release

on:
  push:
    branches: [main]
  # An escape hatch for a publish that failed with the tag already cut: this
  # re-runs the publish job against `main` without cutting anything new.
  workflow_dispatch:

# The publish is the point of no return, so nothing else may be running against
# the same branch when it happens.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    name: Release PR
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      released: ${{ steps.release.outputs.releases_created }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          # A pull request opened with the default `GITHUB_TOKEN` triggers no
          # other workflow, so the release PR would sit there with no CI on it.
          # A PAT or App token in `RELEASE_PLEASE_TOKEN` restores that. The
          # publish job re-runs every gate either way, so its absence costs
          # review signal rather than safety.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    name: Publish
    needs: release-please
    if: ${{ needs.release-please.outputs.released == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      # Load-bearing twice over: npm trades this token for the credential it
      # publishes with, so there is none stored here, and it signs the
      # provenance a consumer checks the tarball against.
      id-token: write
    steps:
      # The release commit release-please just pushed — the tree that carries
      # the bumped manifests, and the one everything below proves.
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # npm configures trusted publishing per package, and there is nothing to
      # configure until a package exists — so a package new to this repository
      # cannot be published by OIDC at all. Reaching that at its turn in the
      # loop below costs a partial release: the packages published before it are
      # on the registry and nothing takes them back. Reaching it here costs a
      # failed run and nothing else, which is why this runs before the gates
      # rather than beside the publish. No amount of proving the tree changes
      # the answer.
      - name: The registry has heard of every package
        run: |
          unknown=""
          for package in core eslint-plugin oxlint-plugin cli; do
            name=$(node -p "require('./packages/$package/package.json').name")
            if answer=$(npm view "$name" name 2>&1); then
              continue
            fi
            # A registry that cannot be reached is not a registry saying "no
            # such package", and reporting it as one would send a maintainer off
            # to hand-publish something that is already there.
            case "$answer" in
              *E404*) unknown="$unknown $name" ;;
              *) printf '%s\n' "$answer" >&2; exit 1 ;;
            esac
          done
          if [ -n "$unknown" ]; then
            echo "::error::Not on the registry, so nothing here can publish it:$unknown"
            echo "A new package's first version goes up by hand; its trusted publisher"
            echo "is configured after that. The procedure is in docs/releasing.md."
            exit 1
          fi

      - run: pnpm install --frozen-lockfile

      - run: pnpm run build

      # Every gate, on the release commit. CI runs a wider version of this on
      # the release PR, but only when release-please had a token that could
      # trigger it — and only the run below is guaranteed to have happened
      # against the manifests that are about to be packed.
      - name: The four manifests moved together
        run: pnpm run check:lockstep

      - run: pnpm run check:docs

      - run: pnpm run conformance

      - run: pnpm run conformance:cli

      - run: pnpm run conformance:oxlint

      - name: Diagnostics audit
        run: pnpm run audit:diagnostics

      - name: ESLint peer gate
        run: pnpm run gate:peer:eslint

      - name: oxlint peer gate
        run: pnpm run gate:peer:oxlint

      - name: TypeScript peer gate
        run: pnpm run gate:peer:typescript

      - name: Hostile fuzz gate
        run: pnpm run gate:fuzz

      - name: Drift gate
        run: pnpm run gate:drift

      - name: DOM hostile fuzz gate
        run: pnpm run dom:gate:fuzz

      - name: DOM deferred-invocation gate
        run: pnpm run dom:gate:deferred

      - name: DOM drift gate
        run: pnpm run dom:gate:drift

      # What a consumer will actually download, checked before anything is
      # published: a `files` list that forgot the baseline data produces a
      # package that installs and floors everything.
      - name: The tarballs carry what they claim
        run: pnpm run check:packed

      # Trusted publishing needs npm 11.5.1 or later, which is newer than what
      # Node 22 bundles. Nothing else in this repo runs through npm, so this is
      # scoped to the runner rather than to the toolchain.
      - name: An npm that speaks OIDC
        run: npm install --global npm@^11.5.1

      # Two tools because neither can do both halves. pnpm packs: it rewrites
      # `workspace:*` to the exact version, which npm has no notion of and would
      # publish literally, breaking every consumer. npm publishes: it exchanges
      # this job's id-token for a short-lived registry credential, which pnpm 9
      # cannot do. So pnpm produces the tarball and npm uploads it.
      #
      # Order matters for the same reason it always did: the adapters name
      # `@no-throw/core` as a dependency, and a consumer installing one before
      # core is on the registry gets something unresolvable.
      #
      # A package already on the registry at this version is skipped, which is
      # what lets the `workflow_dispatch` re-run finish a release that stopped
      # halfway: npm refuses a version it already holds, so a restart would die
      # on the first package rather than reach the ones that never went out.
      # Only an exact version match skips. Any other answer is a publish
      # attempt, so a registry that is merely unreachable cannot quietly turn
      # into a release that shipped nothing and said it was fine.
      - name: Publish
        run: |
          for package in core eslint-plugin oxlint-plugin cli; do
            manifest="packages/$package/package.json"
            name=$(node -p "require('./$manifest').name")
            version=$(node -p "require('./$manifest').version")

            published=$(npm view "$name@$version" version 2>/dev/null || true)
            if [ "$published" = "$version" ]; then
              echo "$name@$version is already on the registry."
              continue
            fi

            tarball=$(cd "packages/$package" && pnpm pack | tail -1)
            npm publish "packages/$package/$tarball" --access public --provenance
          done
