name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  conformance:
    name: Build and conformance suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run build

      - run: pnpm run check:lockstep

      - run: pnpm run conformance

  baseline:
    name: Baseline gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run build

      # The baseline is generated data, so its correctness is CI over that data
      # rather than a test at the conformance seam. Both gates run over what is
      # committed; neither needs the ECMA-262 spec.
      - name: Hostile fuzz gate
        run: pnpm run gate:fuzz

      # A gate that cannot fail is not a gate: plant known-throwing members as
      # clean and require every one of them to be refuted.
      - name: Hostile fuzz gate can fail
        run: pnpm run gate:fuzz -- --self-check

      - name: Drift gate
        run: pnpm run gate:drift

      - name: Drift gate reports an injected diff
        run: pnpm run gate:drift -- --self-check
